# 工具审批规则（设计文档 7.5，D22）：auto 自动执行，ask 先问你。在 MCP 页按工具设置，也可以手改，
# 改完在 MCP 页点"重新加载"。这些规则只在会话权限为"每次先问"时起作用（D23）。
# 名字可以用 * 通配，从上往下第一条匹配的为准。
# 没写到的工具：
# - 内置工具（读写会话文件、检索知识库、记住一条记忆等）自动执行：记忆可以随时在知识库页修改或删除。
#   执行命令（execute）例外：每次都先问你，写在代码里，这里的规则改不了它（D20、D21）。
# - MCP 工具：服务声明为只读的（查询类）自动执行，其余按 mcp_default。
# version 是文件格式的版本：升级时程序按它自动迁移，不用改。
# 说明与例子都写在开头这一段：在 MCP 页上保存时，开头的注释会留着，写在下面正文里的会丢。
# 例：写共享文件夹不用问我——在 tools: 下面空两格加一行 files_write_file: auto。
version: 1
mcp_default: ask
tools:
